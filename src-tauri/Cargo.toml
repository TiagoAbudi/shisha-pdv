[package]
name = "shisha-pdv"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "shisha_pdv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Otimizações para diminuir o tamanho do arquivo e remover qualquer console
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
